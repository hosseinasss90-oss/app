name: Build Hesabino APK

# ساخت APK حسابینو با GitHub Actions و انتشار به صورت یک Release قابل دانلود.

on:
  push:
    branches:
      - arena/01a08808-app
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hesabino

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabino-debug-apk
          path: hesabino/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="hesabino-debug-apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Hesabino test build (debug APK)" \
            --notes "APK test build of Hesabino (debug) for Android. Built by GitHub Actions from branch ${GITHUB_REF_NAME} commit ${GITHUB_SHA}" \
            || true
          echo "release_url=$(gh release view "$TAG" --json url -q .url 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Show release URL
        if: always()
        run: |
          echo "Check the 'Releases' page of the repository for the APK download link."
          echo "release_url=$release_url"
